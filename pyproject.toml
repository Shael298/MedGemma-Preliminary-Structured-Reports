[project]
name = "gemma"
version = "0.1.0"
description = "MedGemma-powered medical image screening and preliminary structured report drafting app."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.11.0",
    "bitsandbytes>=0.48.1",
    "json-repair>=0.58.6",
    "numpy>=2.3.3",
    "pillow>=11.3.0",
    "pydantic>=2.11.7",
    "pydicom>=3.0.1",
    "python-dotenv>=1.1.1",
    "streamlit>=1.55.0",
    "torch>=2.8.0",
    "transformers>=4.55.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "app",
    "medgemma_service",
    "schemas",
    "smoke_test",
]

[tool.streamlit]
entrypoint = "app.py"
